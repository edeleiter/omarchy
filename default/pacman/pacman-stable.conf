# See the pacman.conf(5) manpage for option and repository directives

[options]
# The retained Armbian kernel is built without CONFIG_SECURITY_LANDLOCK, so pacman 7's
# download sandbox cannot initialise and every operation fails with "restricting
# filesystem access failed". This must live here rather than as a --disable-sandbox flag:
# omarchy's own commands (omarchy-update, omarchy-pkg-add, the install leaves) call pacman
# internally and pass no such flag. Verified on the board: 7.0.9-edge-rockchip64 reports
# "# CONFIG_SECURITY_LANDLOCK is not set".
DisableSandbox
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Arch Linux ARM's own repositories. [alarm] carries the ARM-specific packages and
# [aur] is ALARM's prebuilt subset of the AUR; neither exists on x86 Arch. There is no
# [multilib] on aarch64 at all - upstream enables it unconditionally, and on this board
# that alone breaks every subsequent `pacman -Sy`.
[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# The 23 packages Omarchy ships that ALARM does not carry, built locally from
# omarchy-pkgs. pkgs.omarchy.org publishes x86_64 only, so there is nothing upstream to
# point at. Unsigned by decision: signing a repo that never leaves this machine buys
# nothing, and TrustAll keeps `pacman -Sy` from prompting on every package.
#
# The path is the one P6b's repo-add writes to. Kept identical across all three channel
# files: a local repo has no stable/rc/edge split, and making them differ would let
# `omarchy-channel-set` silently restore [multilib] and the x86 mirror layout.
[omarchy]
SigLevel = Optional TrustAll
Server = file:///var/cache/omarchy-repo
